name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Injetar a configuração do Firebase (Secrets)
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          python3 - <<'PY'
          import os, sys
          names = ["FIREBASE_API_KEY", "FIREBASE_AUTH_DOMAIN", "FIREBASE_PROJECT_ID",
                   "FIREBASE_STORAGE_BUCKET", "FIREBASE_MESSAGING_SENDER_ID",
                   "FIREBASE_APP_ID", "OWNER_EMAIL"]
          missing = [n for n in names if not os.environ.get(n, "").strip()]
          if missing:
              sys.exit("Secrets ausentes: " + ", ".join(missing))
          html = open("index.html", encoding="utf-8").read()
          for n in names:
              html = html.replace("__" + n + "__", os.environ[n].strip())
          open("index.html", "w", encoding="utf-8").write(html)
          PY

      - name: Montar a pasta do site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r images _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
